<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Financing | Magnicarz</title>
<link rel="stylesheet" href="../styles.css"></head>
<body>
<header class="site-header" style="position:relative"><a class="brand" href="../index.html"><span class="brand-mark"></span><span><strong>MAGNICARZ</strong><small>DRIVE A BETTER TOMORROW</small></span></a></header>
<main style="max-width:900px;margin:auto;padding:60px 24px 100px">
<p class="section-kicker">MAGNICARZ</p><h1 style="font-size:clamp(42px,7vw,76px)">Auto Financing</h1><p class="hero-copy">Tell us about the vehicle and financing you need.</p>
<form style="margin-top:40px;display:grid;gap:16px" onsubmit="event.preventDefault();alert('Workflow form ready for backend/Zoho CRM integration.');">
<label>Name<input required name="name" style="display:block;width:100%;padding:15px;margin-top:6px"></label>
<label>Phone<input required name="phone" type="tel" style="display:block;width:100%;padding:15px;margin-top:6px"></label>
<label>Email<input name="email" type="email" style="display:block;width:100%;padding:15px;margin-top:6px"></label>
<label>Requirements<textarea name="requirements" rows="5" style="display:block;width:100%;padding:15px;margin-top:6px"></textarea></label>
<button type="submit" style="padding:16px;border:0;border-radius:12px;background:#f7d887;color:#111;font-weight:700">Continue</button>
</form></main></body></html>
